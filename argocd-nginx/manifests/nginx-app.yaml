
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/sahilrana7582/gitops-argocd.git
    targetRevision: main
    path: argocd-nginx/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-demo

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

